<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hero-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .hero-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.8px;
    }
    .channel-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient Pulsing Orbs in Background */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.85; }
    }
    .orb-1 {
      animation: pulseGlow 10s ease-in-out infinite;
      transform-origin: 250px 150px;
    }
    .orb-2 {
      animation: pulseGlow 12s ease-in-out infinite reverse;
      transform-origin: 950px 220px;
    }

    /* Floating Channel Cards */
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes float4 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }

    .float-card-1 { animation: float1 5s ease-in-out infinite; }
    .float-card-2 { animation: float2 6s ease-in-out 0.8s infinite; }
    .float-card-3 { animation: float3 5.5s ease-in-out 1.5s infinite; }
    .float-card-4 { animation: float4 6.5s ease-in-out 2.2s infinite; }

    /* Animated Signal Beam */
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    .stream-line {
      stroke: url(#accentGrad);
      stroke-width: 2;
      stroke-dasharray: 6 8;
      animation: dashMove 2.5s linear infinite;
      opacity: 0.65;
    }

    /* Pulse Dots */
    @keyframes pingDot {
      0%, 100% { opacity: 0.3; r: 3px; }
      50% { opacity: 1; r: 4.5px; }
    }
    .live-dot {
      animation: pingDot 2s ease-in-out infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated Glows (Deep back layer) -->
  <g class="orb-1">
    <circle cx="220" cy="120" r="180" fill="url(#glowGrad1)" />
  </g>
  <g class="orb-2">
    <circle cx="980" cy="240" r="220" fill="url(#glowGrad2)" />
  </g>

  <!-- Background Decorative Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="880" y1="0" x2="880" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Connecting Animated Data Stream Lines -->
  <path d="M 120 330 C 260 300, 320 340, 420 330" fill="none" class="stream-line" />
  <path d="M 450 330 C 580 320, 680 345, 780 330" fill="none" class="stream-line" />
  <path d="M 800 330 C 920 315, 980 340, 1080 330" fill="none" class="stream-line" />

  <!-- DYNAMIC / ANIMATED CHANNEL PILLS (Lower Foreground) -->
  <!-- Pill 1: Live Chat -->
  <g class="float-card-1" transform="translate(100, 295)">
    <rect width="210" height="58" rx="29" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="32" cy="29" r="14" fill="#0284c7" fill-opacity="0.3" />
    <!-- Chat Icon -->
    <path d="M26 23 h12 a3 3 0 0 1 3 3 v6 a3 3 0 0 1 -3 3 h-5 l-4 4 v-4 h-3 a3 3 0 0 1 -3 -3 v-6 a3 3 0 0 1 3 -3 z" fill="#38bdf8" />
    <text x="58" y="34" class="channel-text">💬 Live Chat &amp; Web</text>
    <circle cx="188" cy="29" r="4" fill="#10b981" class="live-dot" />
  </g>

  <!-- Pill 2: Shared Email & Helpdesk -->
  <g class="float-card-2" transform="translate(340, 305)">
    <rect width="230" height="58" rx="29" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="32" cy="29" r="14" fill="#4f46e5" fill-opacity="0.3" />
    <!-- Email Icon -->
    <path d="M24 23 h16 a2 2 0 0 1 2 2 v10 a2 2 0 0 1 -2 2 h-16 a2 2 0 0 1 -2 -2 v-10 a2 2 0 0 1 2 -2 z M25 25 l7 5 l7 -5" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="58" y="34" class="channel-text">✉️ Shared Email Inbox</text>
    <circle cx="208" cy="29" r="4" fill="#818cf8" class="live-dot" />
  </g>

  <!-- Pill 3: WhatsApp & Social -->
  <g class="float-card-3" transform="translate(600, 295)">
    <rect width="230" height="58" rx="29" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="32" cy="29" r="14" fill="#059669" fill-opacity="0.3" />
    <!-- WhatsApp / Social Icon -->
    <path d="M32 20 a8 8 0 0 0 -7 12 l-2 5 l5 -2 a8 8 0 1 0 4 -15 z" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="58" y="34" class="channel-text">📱 WhatsApp &amp; Social</text>
    <circle cx="208" cy="29" r="4" fill="#34d399" class="live-dot" />
  </g>

  <!-- Pill 4: AI Agents & Copilot -->
  <g class="float-card-4" transform="translate(860, 305)">
    <rect width="240" height="58" rx="29" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="32" cy="29" r="14" fill="#9333ea" fill-opacity="0.3" />
    <!-- AI / Bot Icon -->
    <path d="M27 24 h10 a2 2 0 0 1 2 2 v6 a2 2 0 0 1 -2 2 h-10 a2 2 0 0 1 -2 -2 v-6 a2 2 0 0 1 2 -2 z M32 20 v4 M29 28 h.01 M35 28 h.01" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="58" y="34" class="channel-text">🤖 AI Agents &amp; Routing</text>
    <circle cx="218" cy="29" r="4" fill="#c084fc" class="live-dot" />
  </g>

  <!-- FOREGROUND HERO HEADER & TEXT (Clear & Prominent) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 52)">
      <rect width="320" height="32" rx="16" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="18" cy="16" r="4" fill="#38bdf8" />
      <text x="32" y="21" class="badge-text">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" class="hero-title">
      Awesome Multi-Channel
      <tspan fill="url(#accentGrad)"> Customer Messaging</tspan>
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="188" class="hero-subtitle">
      The definitive index of unified customer inbox platforms, conversational support,
    </text>
    <text x="0" y="216" class="hero-subtitle">
      and open-source live chat alternatives for modern customer engagement.
    </text>
  </g>

  <!-- Foreground subtle bottom border line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
